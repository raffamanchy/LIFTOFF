<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LIFTOFF</title>
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/raffamanchy/TRYP-FPV/main/PNG.ico">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #6b5b45; font-family: consolas, sans-serif; position: fixed; }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; overflow: hidden; }
        canvas { width: 100% !important; height: 100% !important; display: block; }
        
        /* OSD - DJI GOGGLES STYLE */
        :root { --osd-scale: 1; } /* change this one number to resize the whole OSD (1 = original size) */
        .fosd { position: absolute; z-index: 15; pointer-events: none; color: #f2f2f2; font-family: "Arial Black", Arial, sans-serif; font-style: italic; font-weight: 800; text-shadow: 0 0 3px rgba(0,0,0,0.5); }
        #fpv-osd-left { left: max(4.1vw, env(safe-area-inset-left)); bottom: 3.9vh; display: flex; align-items: flex-end; gap: 1.2vw; font-size: calc(var(--osd-scale) * clamp(10px, 1.6vw, 28px)); }
        #osd-mode { background: #eee; color: #111; width: 1.75em; height: 1.5em; transform: skewX(-8deg); display: flex; align-items: center; justify-content: center; font-size: 1.4em; border-radius: 3px; text-shadow: none; }
        .osd-col { display: flex; flex-direction: column; line-height: 1.15; min-width: 5.5em; }
        .osd-sp { padding-left: 1.5em; }
        #fpv-osd-right { right: max(12vw, env(safe-area-inset-right)); bottom: 4.2vh; display: flex; align-items: center; gap: 1.8vw; font-size: calc(var(--osd-scale) * clamp(8px, 0.8vw, 14px)); }
        #fpv-osd-right svg { height: 2.3em; width: auto; }
        .osd-bars { display: flex; flex-direction: column; gap: 0.2em; line-height: 1; }
        .osd-bars > div { display: flex; align-items: flex-end; }
        .bars-w { display: inline-flex; align-items: flex-end; margin-left: 6px; }
        .bars-w i { display: inline-block; width: 0.4em; margin-left: 2px; background: #f2f2f2; }
        .osd-sat { display: flex; align-items: flex-start; gap: 4px; }
        #fpv-osd-icons { right: 2.2vw; top: 22vh; display: flex; flex-direction: column; gap: 3vh; }
        #fpv-osd-icons svg { width: calc(var(--osd-scale) * clamp(18px, 2vw, 32px)); height: calc(var(--osd-scale) * clamp(18px, 2vw, 32px)); fill: #f2f2f2; }

        /* RC STICKS OVERLAY - DJI STYLE (Lowered position) */
        #rc-sticks-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 12;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Bracket Box Container -> rounded translucent square */
        .stick-box-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            pointer-events: auto;
        }

        .stick-box {
            width: 100%;
            height: 100%;
            background: rgba(118, 114, 108, 0.52);
            border-radius: 3px;
            position: relative;
            overflow: visible;
        }
        .stick-box::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: #fff; z-index: 2; }

        /* Thin dashed crosshairs */
        .stick-cross-h {
            position: absolute; top: 50%; left: 0; width: 100%; height: 1.5px;
            background: repeating-linear-gradient(to right, rgba(255,255,255,0.95) 0 8px, transparent 8px 13px);
            transform: translateY(-50%); z-index: 1;
        }
        .stick-cross-v {
            position: absolute; top: 0; left: 50%; width: 1.5px; height: 100%;
            background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.95) 0 8px, transparent 8px 13px);
            transform: translateX(-50%); z-index: 1;
        }

        /* Hollow white ring */
        .stick-ball {
            position: absolute; width: 10px; height: 10px;
            background: rgba(255,255,255,0.12);
            border: 2.5px solid #ffffff;
            border-radius: 50%;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 4;
        }

        .hud-circle-btn {
            width: 44px;
            height: 44px;
            background: rgba(20, 25, 35, 0.85);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            font-size: 16px;
            transition: background 0.2s;
        }
        .hud-circle-btn:hover { background: rgba(40, 50, 70, 0.95); }

        #touch-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 9; pointer-events: none; display: none; }
        .touch-pad {
            position: absolute; bottom: max(45px, env(safe-area-inset-bottom)); width: 150px; height: 150px;
            background: rgba(255, 255, 255, 0.05); border: none;
            border-radius: 50%; pointer-events: auto; touch-action: none;
            opacity: 0.4;
        }
        #touch-left-pad { left: max(55px, env(safe-area-inset-left)); }
        #touch-right-pad { right: max(55px, env(safe-area-inset-right)); }
        .touch-knob {
            position: absolute; top: 50%; left: 50%; width: 55px; height: 55px;
            background: rgba(255, 255, 255, 0.5); border: none; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #top-action-bar {
            position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(15px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 8px; z-index: 8; pointer-events: auto;
            background: transparent;
        }
        .top-btn {
            background: rgba(20, 25, 35, 0.85); color: #ffffff; border: 1.5px solid rgba(255, 255, 255, 0.2);
            padding: 0 10px; height: 36px; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 12px; font-weight: bold; font-family: consolas, sans-serif;
        }
        .top-btn:hover { background: rgba(40, 50, 70, 0.95); }

        #top-menu-bar { 
            position: absolute; top: max(12px, env(safe-area-inset-top)); left: max(15px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 10px; z-index: 8; pointer-events: auto; 
            background: transparent;
        }

        #instructions {
            position: absolute; inset: 0; color: #fff; z-index: 20; cursor: default; transition: opacity 0.4s ease;
            background: linear-gradient(90deg, rgba(10,14,12,0.55), rgba(10,14,12,0.15) 60%, rgba(10,14,12,0.35));
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); font-family: "Segoe UI", Arial, sans-serif;
        }
        #menu-content { position: absolute; inset: 0; pointer-events: none; }
        #menu-title, #instruction-text { display: none; }
        #hs-side { position: absolute; left: 2.2vw; top: 3.5vh; display: flex; flex-direction: column; gap: 4.6vh; align-items: center; }
        #hs-side svg { width: 1.9vw; min-width: 22px; height: auto; stroke: #fff; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        #hs-list { position: absolute; left: 5.8vw; top: 6.8vh; width: 21vw; min-width: 190px; display: flex; flex-direction: column; gap: 1.8vh; pointer-events: auto; }
        .hs-btn { position: relative; height: 5.6vh; min-height: 36px; display: flex; align-items: center; justify-content: center; background: #fff; color: #333;
            font-size: clamp(11px, 1.05vw, 17px); letter-spacing: 0.04em; cursor: pointer; border: 0; font-family: inherit;
            clip-path: polygon(0 0, 100% 0, 94% 100%, 0 100%); transition: filter 0.15s, transform 0.15s; padding: 0; }
        .hs-btn:hover { filter: brightness(0.93); transform: translateX(4px); }
        .hs-btn:before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0.9vw; min-width: 8px; background: var(--c, #ccc); }
        .hs-btn.active { background: #5b9a8b; color: #fff; font-weight: 700; }
        .hs-btn.active:before { background: #5b9a8b; }
        #hs-tabs { position: absolute; left: calc(5.8vw + 21vw + 1vw); top: 6.8vh; display: flex; height: 5.6vh; min-height: 36px; pointer-events: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        #hs-tabs .arrow { width: 7vw; background: #5b9a8b; clip-path: polygon(0 0, 78% 0, 100% 100%, 0 100%); margin-right: -1.5vw; }
        #hs-tabs .bar { display: flex; background: #fff; padding: 0 2vw 0 1vw; clip-path: polygon(0 0, 100% 0, 97% 100%, 0 100%); }
        .hs-tab { background: none; border: 0; color: #333; font-family: inherit; font-size: clamp(11px, 1.05vw, 17px); padding: 0 2.2vw; cursor: pointer; }
        .hs-tab:hover { color: #5b9a8b; font-weight: 700; }
        #hs-user { position: absolute; right: 1.6vw; top: 1.6vh; display: flex; align-items: center; gap: 0.8vw; pointer-events: auto; font-size: clamp(11px, 1vw, 16px); text-align: center; }
        #hs-user .sign { display: block; background: #eee; color: #444; font-size: 0.8em; padding: 1px 14px; margin-top: 2px; cursor: pointer; }
        #hs-user .av { width: 2.6vw; min-width: 30px; aspect-ratio: 1; border-radius: 8px; background: radial-gradient(circle, #ff7ac8, #6a3cff); border-left: 1px solid #fff8; }
        #hs-logo { position: absolute; right: 4.2vw; bottom: 6vh; font-size: clamp(36px, 7vw, 120px); font-weight: 900; font-style: italic; letter-spacing: -0.04em; text-shadow: 0 4px 18px rgba(0,0,0,0.45); }
        #hs-ver { position: absolute; left: 1.6vw; bottom: 2.2vh; background: rgba(0,0,0,0.55); border-radius: 14px; padding: 4px 12px; font-size: clamp(9px, 0.8vw, 13px); }
        #hs-toast { position: absolute; left: 50%; bottom: 8vh; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 18px; border-radius: 6px; opacity: 0; transition: opacity 0.3s; font-size: 14px; }

        #hs-panel { display: none; position: absolute; left: calc(5.8vw + 21vw + 1vw); top: 14.5vh; width: min(46vw, 560px); max-height: 70vh; overflow-y: auto; background: rgba(250,250,248,0.96); color: #2e3436;
            pointer-events: auto; padding: 1.4vh 1.6vw 1.6vh; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); box-shadow: 0 8px 30px rgba(0,0,0,0.4); border-top: 5px solid #5b9a8b; font-size: clamp(11px, 1vw, 16px); }
        #hs-panel h2 { margin: 0.2em 0 0.6em; font-size: 1.3em; letter-spacing: 0.06em; color: #3f7b6d; }
        .prow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0.55em 0; border-bottom: 1px solid #0001; }
        .prow label { flex: 0 0 38%; }
        .pseg { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
        .pbtn { background: #e6e9e8; border: 0; padding: 0.4em 0.9em; cursor: pointer; font-family: inherit; font-size: inherit; color: #2e3436; }
        .pbtn:hover { background: #d3dad8; } .pbtn.on { background: #5b9a8b; color: #fff; }
        .prow input[type=range] { flex: 1; accent-color: #5b9a8b; } .prow .val { width: 3.6em; text-align: right; }
        .pnote { padding: 0.5em 0; line-height: 1.5; color: #555; }
        #race-hud { position: absolute; top: 2.5vh; left: 50%; transform: translateX(-50%); z-index: 12; display: none; color: #fff; font-style: italic; font-weight: 800; font-size: clamp(14px, 1.7vw, 28px);
            background: rgba(0,0,0,0.45); padding: 0.4em 1.2em; clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); text-align: center; letter-spacing: 0.04em; }
        #race-msg { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); z-index: 12; display: none; color: #fff; font-style: italic; font-weight: 900; font-size: clamp(36px, 7vw, 110px); text-shadow: 0 4px 16px rgba(0,0,0,0.6); text-align: center; line-height: 1.1; }
        #race-msg small { display: block; font-size: 0.28em; font-weight: 700; }
        #tut-hud { position: absolute; left: 2vw; top: 3vh; z-index: 12; display: none; background: rgba(0,0,0,0.5); color: #fff; padding: 1vh 1.2vw; font-size: clamp(11px, 1.1vw, 17px); line-height: 1.7; max-width: 30vw; }
        #tut-hud .done { color: #7be0a3; text-decoration: line-through; } #tut-hud .cur { color: #ffd23f; font-weight: 700; }
        #mp-badge { position: absolute; left: 50%; top: 9vh; transform: translateX(-50%); z-index: 12; display: none; color: #7be0a3; font-weight: 800; font-size: clamp(10px, 0.95vw, 15px); text-shadow: 0 1px 3px #000; pointer-events: none; }
        #hs-panel input[type=text] { font-family: inherit; font-size: inherit; padding: 0.4em 0.6em; border: 1px solid #0003; width: 9em; text-transform: uppercase; }
        .mpcode { font-size: 2.4em; font-weight: 900; letter-spacing: 0.25em; color: #3f7b6d; text-align: center; padding: 0.3em 0; }
        body.no-osd #fpv-osd-left, body.no-osd #fpv-osd-right, body.no-osd #fpv-osd-icons { display: none !important; }
        body.no-sticks #rc-sticks-container { display: none !important; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="canvas-container">
        <!-- OSD (DJI Goggles style) -->
        <div id="fpv-osd-left" class="fosd">
            <div id="osd-mode">M</div>
            <div class="osd-col"><span class="osd-sp" id="osd-vs">0.0m/s</span><span class="osd-lb">H&nbsp;&nbsp;<span id="osd-h">0m</span></span></div>
            <div class="osd-col"><span class="osd-sp" id="osd-hs">0.0m/s</span><span class="osd-lb">D&nbsp;&nbsp;<span id="osd-d">0m</span></span></div>
        </div>
        <div id="fpv-osd-right" class="fosd">
            <svg width="30" height="38" viewBox="0 0 24 28" fill="#f2f2f2"><path d="M12 8a9 9 0 0 1 8 4l-1.6 1.2A7 7 0 0 0 12 10a7 7 0 0 0-6.400 3.200L4 12a9 9 0 0 1 8-4zm0 4.500a4.500 4.500 0 0 1 3.600 1.800L14 15.500a2.500 2.500 0 0 0-4 0l-1.600-1.200A4.500 4.500 0 0 1 12 12.500zM12 17l5 9h-2l-1-2h-4l-1 2H7z"/></svg>
            <div class="osd-bars"><div>RC <span id="osd-rc" class="bars-w"></span></div><div>HD <span id="osd-hd" class="bars-w"></span></div></div>
            <div class="osd-sat"><svg width="38" height="38" viewBox="0 0 24 24" fill="#f2f2f2"><path d="M9 3l4 4-2 2 3 3 2-2 4 4-4 4-12-12zM3 14a7 7 0 0 1 7 7H8a5 5 0 0 0-5-5z"/></svg><span>19</span></div>
        </div>
        <div id="fpv-osd-icons" class="fosd">
            <svg viewBox="0 0 24 24"><path d="M2 6h14v12H2zM16 9l6-3v12l-6-3z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M2 6h14v12H2zM16 9l6-3v12l-6-3z"/></svg>
        </div>

        <div id="top-menu-bar"></div>

        <div id="mp-badge"></div><div id="race-hud"></div><div id="race-msg"></div><div id="tut-hud"></div>
        <div id="top-action-bar">
            <button class="top-btn" id="btn-switch-view" title="Switch View">&#127916;</button>
            <button class="top-btn" id="btn-retry" title="Reset">&#8634;</button>
            <button class="top-btn" id="btn-pause" title="Pause">&#10074;&#10074;</button>
        </div>

        <!-- DJI Overlay Style Stick Containers -->
        <div id="rc-sticks-container">
            <button id="btn-motor-toggle" class="hud-circle-btn" title="Toggle Motor">&#10074;&#10074;</button>
            
            <div class="stick-box-wrapper" id="wrapper-left">
                <div class="stick-box" id="box-left">
                    <div class="stick-cross-h"></div>
                    <div class="stick-cross-v"></div>
                    <div id="stick-left" class="stick-ball"></div>
                </div>
            </div>

            <div class="stick-box-wrapper" id="wrapper-right">
                <div class="stick-box" id="box-right">
                    <div class="stick-cross-h"></div>
                    <div class="stick-cross-v"></div>
                    <div id="stick-right" class="stick-ball"></div>
                </div>
            </div>

            <button id="btn-fullscreen-toggle" class="hud-circle-btn" title="Lock/Fullscreen">&#128274;</button>
        </div>

        <div id="touch-controls">
            <div id="touch-left-pad" class="touch-pad"><div id="touch-left-knob" class="touch-knob"></div></div>
            <div id="touch-right-pad" class="touch-pad"><div id="touch-right-knob" class="touch-knob"></div></div>
        </div>

        <div id="instructions">
            <div id="menu-content">
                <h1 id="menu-title">LIFTOFF</h1><p id="instruction-text"></p>
                <div id="hs-side">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M6 21v-6a6 6 0 0 1 12 0v6"/></svg>
                    <svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="3"/><circle cx="16" cy="7" r="3"/><path d="M2 20v-5a4 4 0 0 1 4-4M22 20v-5a4 4 0 0 0-4-4M8 20v-5h8v5"/></svg>
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
                    <svg viewBox="0 0 24 24"><path d="M6 8h12a4 4 0 0 1 4 4v3a2 2 0 0 1-3.500 1.300L16 14H8l-2.500 2.300A2 2 0 0 1 2 15v-3a4 4 0 0 1 4-4z"/><path d="M7 11v2M6 12h2"/></svg>
                    <svg viewBox="0 0 24 24"><path d="M12 3v8M7 6a8 8 0 1 0 10 0"/></svg>
                </div>
                <div id="hs-list">
                    <button class="hs-btn active" data-go="1">SINGLE PLAYER</button>
                    <button class="hs-btn" style="--c:#f2e08a" data-panel="multi">MULTIPLAYER</button>
                    <button class="hs-btn" style="--c:#f2a96b" data-panel="tools">TOOLS</button>
                    <button class="hs-btn" style="--c:#e0605a" data-panel="options">OPTIONS</button>
                    <button class="hs-btn" style="--c:#9a3f3f" data-panel="quit">QUIT</button>
                </div>
                <div id="hs-tabs"><div class="arrow"></div><div class="bar">
                    <button class="hs-tab" data-act="tutorial">TUTORIAL</button>
                    <button class="hs-tab" id="btn-start-game">QUICK PLAY</button>
                    <button class="hs-tab" data-act="free">FREE FLIGHT</button>
                    <button class="hs-tab" data-act="race">RACE</button>
                    <button class="hs-tab" data-act="freestyle">FREESTYLE</button>
                </div></div>
                <div id="hs-user"><div>Pilot<span class="sign">Sign In</span></div><div class="av"></div></div>
                <div id="hs-logo">LIFTOFF</div>
                <div id="hs-ver">v1.0.0 - 26/10/2026</div>
                <div id="hs-panel"></div>
                <div id="hs-toast"></div>
            </div>
        </div>
    </div>

    <script>
        const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        const stickScale = isMobile ? 1.0 : 1.2; 
        document.getElementById('wrapper-left').style.width = (90 * stickScale) + 'px';
        document.getElementById('wrapper-left').style.height = (90 * stickScale) + 'px';
        document.getElementById('wrapper-right').style.width = (90 * stickScale) + 'px';
        document.getElementById('wrapper-right').style.height = (90 * stickScale) + 'px';

        const stickBallSize = 10 * stickScale;
        document.getElementById('stick-left').style.width = stickBallSize + 'px';
        document.getElementById('stick-left').style.height = stickBallSize + 'px';
        document.getElementById('stick-right').style.width = stickBallSize + 'px';
        document.getElementById('stick-right').style.height = stickBallSize + 'px';

        if (isMobile) {
            document.getElementById('touch-controls').style.display = 'block';
            const instructionTextEl = document.getElementById('instruction-text');
            if(instructionTextEl) {
                instructionTextEl.innerHTML = `<b>Cinematic World Preview</b><br>Landscape Mode Recommended`;
            }
        } else {
            document.getElementById('btn-motor-toggle').style.display = 'none';
            document.getElementById('btn-fullscreen-toggle').style.display = 'none';
        }

        const container = document.getElementById('canvas-container');
        const inst = document.getElementById('instructions');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa4caff);
        scene.fog = new THREE.FogExp2(0xbcd6ff, 0.0012);

        const camera = new THREE.PerspectiveCamera(130, window.innerWidth / window.innerHeight, 0.1, 4000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, window.__prCap || 1.75) * (window.__qRes || 1));
        container.appendChild(renderer.domElement);

        function handleResize() {
            const width = window.innerWidth || document.documentElement.clientWidth;
            const height = window.innerHeight || document.documentElement.clientHeight;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            
            renderer.setSize(width, height, true);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, window.__prCap || 1.75) * (window.__qRes || 1));
            if (window.postResize) window.postResize();
        }

        window.addEventListener('resize', handleResize);
        
        function triggerDelayedResize() {
            handleResize();
            setTimeout(handleResize, 100);
            setTimeout(handleResize, 300);
            setTimeout(handleResize, 500);
        }

        window.addEventListener('orientationchange', triggerDelayedResize);
        if (screen.orientation && screen.orientation.addEventListener) {
            screen.orientation.addEventListener('change', triggerDelayedResize);
        }
        setTimeout(handleResize, 100);

            droneGroup.position.copy(drone.position);
            droneGroup.quaternion.copy(drone.rotation);

            if (drone.position.y - groundH(drone.position.x, drone.position.z) <= 1.0 && drone.velocity.length() > 2.0) {
                dustSystem.visible = true;
                dustSystem.position.copy(drone.position);
                dustSystem.position.y = groundH(drone.position.x, drone.position.z) + 0.1;
                const positions = dustSystem.geometry.attributes.position.array;
                const speedMult = drone.velocity.length() * 0.1;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i] += (Math.random() - 0.5) * speedMult;
                    positions[i+2] += (Math.random() - 0.5) * speedMult;
                    if (Math.abs(positions[i]) > 6 || Math.abs(positions[i+2]) > 6) {
                        positions[i] = (Math.random() - 0.5) * 2;
                        positions[i+2] = (Math.random() - 0.5) * 2;
                    }
                }
                dustSystem.geometry.attributes.position.needsUpdate = true;
            } else {
                dustSystem.visible = false;
            }

            droneShadow.position.x = drone.position.x;
            droneShadow.position.z = drone.position.z; droneShadow.position.y = groundH(drone.position.x, drone.position.z) + 0.15;
            const heightFactor = Math.max(0.2, 1.0 - ((drone.position.y - groundH(drone.position.x, drone.position.z)) / 25.0));
            droneShadow.scale.set(3.2 * heightFactor, 3.2 * heightFactor, 1);
            droneShadow.material.opacity = Math.max(0.05, 0.55 * heightFactor);

            const propsMoving = isArmed && currentThrottle > 0.05;
            propMat.opacity = propsMoving ? 0.3 : 1.0;
            if (propsMoving) propMeshes.forEach(prop => { prop.rotation.y += 1.0; });

            cloudGroup.children.forEach(c => {
                c.position.x += 1.5 * dt;
                if(c.position.x > 1500) c.position.x = -1500;
            });

            if (cameraMode === "FPV") {
                camera.position.copy(drone.position);
                const camRot = drone.rotation.clone();
                camRot.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), CAMERA_UPTILT));
                camera.quaternion.copy(camRot);
                propMeshes.forEach(prop => {
                    prop.position.x = prop.userData.baseX + Math.sign(prop.userData.baseX) * 1.2;
                });
                droneGroup.visible = true;
                droneGroup.children.forEach(part => { part.visible = false; });
            } else {
                droneGroup.visible = true;
                propMeshes.forEach(prop => { prop.position.x = prop.userData.baseX; });
                droneGroup.children.forEach(part => { part.visible = true; });
                
                const backOffset = new THREE.Vector3(0, 2.5, 7.5).applyQuaternion(drone.rotation);
                camera.position.lerp(new THREE.Vector3().addVectors(drone.position, backOffset), 0.2);
                
                const lookTarget = drone.position.clone().add(new THREE.Vector3(0, 0.5, -5).applyQuaternion(drone.rotation));
                camera.lookAt(lookTarget);
            }
            { const cg = groundH(camera.position.x, camera.position.z) + 0.5; if (camera.position.y < cg) camera.position.y = cg; }

            mousePitch = 0; mouseRoll = 0;

            const hSpeed = Math.hypot(drone.velocity.x, drone.velocity.z);
            document.getElementById('osd-vs').innerText = drone.velocity.y.toFixed(1) + 'm/s';
            document.getElementById('osd-hs').innerText = hSpeed.toFixed(1) + 'm/s';
            document.getElementById('osd-h').innerText = Math.max(0, Math.round(drone.position.y - 0.3)) + 'm';
            const homeDist = Math.hypot(drone.position.x, drone.position.z - 45);
            document.getElementById('osd-d').innerText = Math.round(homeDist) + 'm';
            document.getElementById('osd-mode').innerText = ({1:'N',2:'S',3:'M'})[activeMode];
            const sigN = Math.max(1, 4 - Math.floor(homeDist / 220));
            if (sigN !== window._osdSig) {
                window._osdSig = sigN;
                ['osd-rc','osd-hd'].forEach(id => {
                    const el = document.getElementById(id); el.innerHTML = '';
                    for (let i = 0; i < 4; i++) { const b = document.createElement('i'); b.style.height = (0.45 + i * 0.35) + 'em'; b.style.opacity = i < sigN ? 1 : 0.3; el.appendChild(b); }
                });
            }

            const stickLeft = document.getElementById('stick-left');
            const stickRight = document.getElementById('stick-right');
            let leftY, leftX, rightX, rightY;

            const maxPixelOffset = (35 * (isMobile ? 1.0 : stickScale));
            if (isMobile) {
                leftY = touchLeftValY * maxPixelOffset; leftX = touchLeftValX * maxPixelOffset;
                rightX = touchRightValX * maxPixelOffset; rightY = touchRightValY * maxPixelOffset;
            } else {
                leftY = -(stickyThrottleValue * 2 - 1) * maxPixelOffset; 
                let klYaw = (keys.d ? 1 : (keys.a ? -1 : 0));
                let klRollStick = (keys.l ? 1 : (keys.j ? -1 : 0));
                let klPitchStick = (keys.i ? -1 : (keys.k ? 1 : 0)); 
                leftX = klYaw * maxPixelOffset;
                rawMouseX *= Math.exp(-12.0 * dt); rawMouseY *= Math.exp(-12.0 * dt);
                rightX = Math.max(-maxPixelOffset, Math.min(maxPixelOffset, (rawMouseX + klRollStick * 20) * 1.4));
                rightY = Math.max(-maxPixelOffset, Math.min(maxPixelOffset, (rawMouseY + klPitchStick * 20) * 1.4));
            }

            stickLeft.style.transform = `translate(calc(-50% + ${leftX}px), calc(-50% + ${leftY}px))`;
            stickRight.style.transform = `translate(calc(-50% + ${rightX}px), calc(-50% + ${rightY}px))`;

            raceUpdate(dt); tutUpdate(); mpUpdate(dt); audioUpdate(dt);
            renderScene();
        }

        animate();
    </script>
</body>
</html>
